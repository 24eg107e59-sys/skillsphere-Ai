spring.application.name=skillsphere-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillsphere?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.show-sql=true

server.port=${PORT:8080}

# JWT Configuration (for Authentication in Task 2)
skillsphere.jwt.secret=SkillSphereSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026
skillsphere.jwt.expiration-ms=86400000
