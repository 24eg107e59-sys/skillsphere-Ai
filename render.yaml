services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: skillsphere-backend
    runtime: docker
    dockerfilePath: backend/backend/Dockerfile
    dockerContext: backend/backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: skillsphere-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
